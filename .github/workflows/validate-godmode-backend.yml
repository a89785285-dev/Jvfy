name: Validate GODMODE backend

on:
  push:
    branches:
      - prompt-forge/inspect-source
    paths:
      - "source-extracted/godmodeapp/**"
      - "render.yaml"
      - ".github/workflows/validate-godmode-backend.yml"
  workflow_dispatch:

concurrency:
  group: godmode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-extracted/godmodeapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source-extracted/godmodeapp/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Bundle Vercel Express entrypoint
        run: pnpm exec esbuild server.ts --platform=node --packages=external --bundle --format=esm --outdir=dist-validation/vercel
      - name: Bundle standalone Express entrypoint
        run: pnpm exec esbuild server/_core/start.ts --platform=node --packages=external --bundle --format=esm --outdir=dist-validation/standalone


name: VANTA ZIP to APK

"on":
  workflow_dispatch:
  push:
    paths:
      - 'VANTA_CODE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP project
        run: |
          mkdir -p source
          unzip -q VANTA_CODE.zip -d source

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find source -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find source -name settings.gradle -print -quit)
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug
          else
            gradle -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-CODE-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

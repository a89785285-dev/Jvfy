
      - name: Find and Extract ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" ! -path "./source/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          mkdir -p source
          unzip -oq "$ZIP_FILE" -d source

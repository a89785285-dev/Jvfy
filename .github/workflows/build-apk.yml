name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this repo to run this job."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: unzip -o *.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: ./godmodeapp
        run: pnpm install

      - name: Configure Project ID and Build APK
        working-directory: ./godmodeapp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            let code = fs.readFileSync("app.config.ts", "utf8");
            code += `\n// Inject EAS Project ID\nconst _orig = module.exports.default || module.exports;\nmodule.exports = (ctx) => { const res = typeof _orig === "function" ? _orig(ctx) : _orig; res.extra = { ...(res.extra || {}), eas: { ...(res.extra?.eas || {}), projectId: "b98d1fb2-1abd-4d36-b12d-824fd8452afe" } }; return res; };\n`;
            fs.writeFileSync("app.config.ts", code);
          '
          eas build -p android --profile preview --non-interactive --no-wait

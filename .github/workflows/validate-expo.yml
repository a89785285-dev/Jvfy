name: Validate Expo app

on:
  push:
    branches:
      - prompt-forge/inspect-source
    paths:
      - "source-extracted/godmodeapp/**"
      - ".github/workflows/validate-expo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-extracted/godmodeapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source-extracted/godmodeapp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Expo Android bundle
        run: pnpm exec expo export --platform android --output-dir /tmp/godmode-android-export

      - name: Expo Web bundle
        run: pnpm exec expo export --platform web --output-dir /tmp/godmode-web-export

      - name: Build API server
        run: pnpm build

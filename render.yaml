services:
  - type: web
    name: godmode-ai-api
    runtime: node
    rootDir: source-extracted/godmodeapp
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_API_BASE_URL
        value: https://api.openai.com
      - key: AI_MODEL
        value: gpt-6-luna
      - key: AI_API_KEY
        sync: false
